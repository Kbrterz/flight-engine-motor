document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 13px; line-height: 1.2; color: var(--color-text);\n  background: transparent; border: 1px solid transparent;\n  padding: calc(var(--space-2) * 0.85) var(--space-3);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 34px; height: 34px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"958868d0-405c-4690-abd8-6fe9761a15a0\"><\u002Fscript>\n  <script src=\"f1fa5d5f-2ec5-4a63-a157-0a174da1a8f2\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--color-bg); }\n    a { color: var(--color-accent-700); text-decoration: none; }\n    a:hover { color: var(--color-accent); }\n    input, select, button { font-family: var(--font-body); }\n    @keyframes fe-spin { to { transform: rotate(360deg); } }\n    /* hero photo has webpage text baked into its lower edge: crop up + fade bottom into page bg */\n    .grayscale{height:clamp(240px,34vh,360px)!important;overflow:hidden!important;position:relative!important}\n    .grayscale > image-slot{display:block;width:100%;height:132%!important;object-fit:cover;object-position:50% 6%}\n    .grayscale::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(to bottom,rgba(243,242,242,0),#f3f2f2 82%);pointer-events:none;z-index:4}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);\">\n\n  <header style=\"display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-divider); flex-wrap: wrap;\">\n    <div style=\"display: flex; align-items: baseline; gap: var(--space-4);\">\n      <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; text-transform: uppercase;\">Flight Engine<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700);\">Takeoff performance console<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px; border: 2px solid var(--color-neutral-400); border-color: {{ t.border }}; background: {{ t.bg }}; color: {{ t.fg }};\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span class=\"tag tag-outline\" style=\"margin-left: var(--space-3); white-space: nowrap;\">Rule set&nbsp;{{ ruleVersion }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position: relative; overflow: hidden; background: var(--color-bg);\">\n      <div class=\"grayscale\" style=\"position: relative; width: 100%; height: clamp(360px, 54vh, 620px); background: var(--color-bg);\">\n        <image-slot id=\"fe-hero-engine\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop hero photo\" src=\"d492c9dd-55de-4c66-bff8-4f460d89407e\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: var(--space-6); border-top: 2px solid var(--color-divider); background: var(--color-bg); flex-wrap: wrap;\">\n        <div style=\"max-width: 44ch;\">\n        <p style=\"margin: 0 0 var(--space-3); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);\">Aerospace performance intelligence<\u002Fp>\n        <h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 4vw, 50px); line-height: 1.02; letter-spacing: -0.02em; margin: 0;\">Power measured in every takeoff.<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"flex: 0 0 auto;\">{{ turbine }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <main style=\"max-width: 1180px; padding: var(--space-8) var(--space-6) var(--space-8);\">\n      <p style=\"margin: 0 0 var(--space-4); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);\">01 — What you get<\u002Fp>\n      <h2 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 0 0 var(--space-4); max-width: 32ch;\">Every number you can defend.<\u002Fh2>\n      <p style=\"margin: 0 0 var(--space-8); font-size: 18px; line-height: 1.5; max-width: 58ch; color: var(--color-neutral-800);\">Flight Engine turns takeoff conditions into a decision in seconds — a deterministic engine computes every figure, a guarded AI layer explains it, and the audit trail records both.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ gains }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"padding: var(--space-6); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n            <p style=\"margin: 0 0 var(--space-3); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ g.no }}<\u002Fp>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 20px; line-height: 1.15; margin: 0 0 var(--space-3);\">{{ g.title }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: var(--color-neutral-800);\">{{ g.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 28px; margin: var(--space-8) 0 var(--space-4);\">The calculation path<\u002Fh2>\n      <div style=\"display: flex; align-items: stretch; flex-wrap: wrap; border: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ pipeline }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <div style=\"flex: 1 1 150px; padding: var(--space-4) var(--space-4); border-right: 2px solid var(--color-divider); background: {{ n.bg }}; color: {{ n.fg }};\">\n            <p style=\"margin: 0 0 var(--space-2); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.72;\">Step {{ n.step }}<\u002Fp>\n            <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 15px; line-height: 1.2;\">{{ n.label }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin: var(--space-3) 0 0; font-size: 13px; color: var(--color-neutral-700);\">The result is produced before AI is called. An AI failure never blocks the number.<\u002Fp>\n\n      <sc-if value=\"{{ showProjectFacts }}\" hint-placeholder-val=\"{{ true }}\">\n        <h2 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 28px; margin: var(--space-8) 0 var(--space-4);\">Delivery frame<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider);\">\n          <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div style=\"padding: var(--space-4) var(--space-4); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n              <p style=\"margin: 0 0 var(--space-2); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ f.k }}<\u002Fp>\n              <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 16px;\">{{ f.v }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top: var(--space-8);\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goConsole }}\">Open the console<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isConsole }}\">\n    <main style=\"max-width: 1320px; padding: var(--space-6) var(--space-6) var(--space-8);\">\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-4);\">\n        <div>\n          <p style=\"margin: 0 0 var(--space-2); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);\">02 — Live calculation<\u002Fp>\n          <h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 34px; letter-spacing: -0.01em; margin: 0;\">Set the conditions.<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: var(--space-2); flex-wrap: wrap;\">\n          <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"font-size: 13px;\">{{ p.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-6); align-items: start;\">\n        <section class=\"card\" style=\"padding: var(--space-6);\">\n          <p class=\"card-kicker\">Flight case<\u002Fp>\n          <h2 class=\"card-title\" style=\"margin-bottom: var(--space-4);\">Inputs<\u002Fh2>\n\n          <div class=\"field\" style=\"margin-bottom: var(--space-4);\">\n            <label for=\"caseName\">Case name<\u002Flabel>\n            <input class=\"input\" id=\"caseName\" type=\"text\" value=\"{{ caseName }}\" sc-camel-on-change=\"{{ onCaseName }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"margin-bottom: var(--space-4);\">\n            <label for=\"acType\">Aircraft type<\u002Flabel>\n            <sc-raw-select class=\"input\" id=\"acType\" value=\"{{ acType }}\" sc-camel-on-change=\"{{ onAcType }}\">\n              <option>Narrowbody T-A (twin)<\u002Foption>\n              <option>Narrowbody T-B (twin)<\u002Foption>\n              <option>Regional jet R-1<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <div class=\"hr\" style=\"margin: 0 0 var(--space-4);\"><\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4);\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div class=\"field\">\n                <label for=\"{{ f.key }}\">{{ f.label }} ({{ f.unit }})<\u002Flabel>\n                <input class=\"input\" id=\"{{ f.key }}\" type=\"number\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" style=\"border: 2px solid var(--color-neutral-400); border-color: {{ f.borderColor }}; font-variant-numeric: tabular-nums;\">\n                <p style=\"margin: var(--space-1) 0 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: {{ f.hintColor }};\">{{ f.hint }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: var(--space-3); margin-top: var(--space-6);\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ run }}\" disabled=\"{{ runDisabled }}\">Run calculation<\u002Fbutton>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ reset }}\">Reset<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"card\" style=\"padding: var(--space-6);\">\n          <p class=\"card-kicker\">Deterministic engine · no AI on this path<\u002Fp>\n          <h2 class=\"card-title\" style=\"margin-bottom: var(--space-4);\">Result<\u002Fh2>\n\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider); margin-bottom: var(--space-4);\">\n            <sc-for list=\"{{ speeds }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"padding: var(--space-4); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n                <p style=\"margin: 0 0 var(--space-2); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ s.k }}<\u002Fp>\n                <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums;\">{{ s.v }}<\u002Fp>\n                <p style=\"margin: var(--space-2) 0 0; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">kt<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-top: 2px solid var(--color-divider);\">\n              <span style=\"font-size: 15px; color: var(--color-neutral-800);\">{{ m.k }}<\u002Fspan>\n              <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums;\">{{ m.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ hasStripe }}\">\n            <div style=\"margin-top: var(--space-4); padding: var(--space-4) var(--space-4); border: 2px solid var(--color-divider); border-color: {{ stripeBorder }}; background: {{ stripeBg }}; color: {{ stripeFg }}; font-family: var(--font-heading); font-weight: 700; font-size: 14px;\">{{ stripeText }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <p style=\"margin: var(--space-4) 0 0; padding-top: var(--space-3); border-top: 2px solid var(--color-divider); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ resultFoot }}<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <section class=\"card\" style=\"padding: var(--space-6); margin-top: var(--space-6);\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-4);\">\n          <div>\n            <span class=\"tag tag-accent\" style=\"margin-bottom: var(--space-3); display: inline-block;\">AI assistance<\u002Fspan>\n            <h2 class=\"card-title\" style=\"margin: 0;\">Explanation<\u002Fh2>\n            <p style=\"margin: var(--space-2) 0 0; font-size: 13px; color: var(--color-neutral-700);\">Explains the deterministic result — never recomputes it.<\u002Fp>\n          <\u002Fdiv>\n          <label style=\"display: flex; align-items: center; gap: var(--space-2); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-800); cursor: pointer;\">\n            <input type=\"checkbox\" checked=\"{{ guard }}\" sc-camel-on-change=\"{{ toggleGuard }}\" style=\"width: 18px; height: 18px; accentColor: var(--color-accent);\">\n            Simulate guardrail block\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ aiBlocked }}\">\n          <div style=\"border: 2px dashed var(--color-accent); padding: var(--space-4); background: var(--color-accent-100);\">\n            <p style=\"margin: 0 0 var(--space-2); font-family: var(--font-heading); font-weight: 700; font-size: 16px; color: var(--color-accent-900);\">Explanation unavailable — response blocked.<\u002Fp>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: var(--color-accent-900);\">The draft answer failed the validation guardrail (schema · numeric cross-check · grounding). The deterministic result above stands unchanged.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ aiReady }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border-top: 2px solid var(--color-divider); border-left: 2px solid var(--color-divider);\">\n            <div style=\"padding: var(--space-4); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n              <p style=\"margin: 0 0 var(--space-3); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">Summary<\u002Fp>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.55;\">{{ aiSummary }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding: var(--space-4); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n              <p style=\"margin: 0 0 var(--space-3); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">Key drivers<\u002Fp>\n              <sc-for list=\"{{ aiDrivers }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <p style=\"margin: 0 0 var(--space-2); font-size: 15px; line-height: 1.45;\">— {{ d }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding: var(--space-4); border-right: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n              <p style=\"margin: 0 0 var(--space-3); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-700);\">Caveats &amp; grounding<\u002Fp>\n              <p style=\"margin: 0 0 var(--space-3); font-size: 15px; line-height: 1.55;\">Illustrative model, not certified performance data. Figures restate the deterministic output; no alternative numbers are offered.<\u002Fp>\n              <p style=\"margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ aiCitation }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ aiIdle }}\">\n          <p style=\"margin: 0; font-size: 15px; color: var(--color-neutral-700);\">Run a calculation to produce an explanation.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRules }}\">\n    <main style=\"max-width: 1180px; padding: var(--space-6) var(--space-6) var(--space-8);\">\n      <p style=\"margin: 0 0 var(--space-2); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);\">03 — Engineering rule set<\u002Fp>\n      <h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 34px; margin: 0 0 var(--space-3);\">Rule set {{ ruleVersion }}<\u002Fh1>\n      <p style=\"margin: 0 0 var(--space-6); font-size: 16px; line-height: 1.5; max-width: 62ch; color: var(--color-neutral-800);\">Signed by the engineering authority and version-controlled. The engine reads only from this set — changing a rule creates a new version, never a silent edit.<\u002Fp>\n      <sc-raw-table class=\"table\">\n        <sc-raw-thead>\n          <sc-raw-tr><sc-raw-th>Parameter<\u002Fsc-raw-th><sc-raw-th>Valid range<\u002Fsc-raw-th><sc-raw-th>Unit<\u002Fsc-raw-th><sc-raw-th>Effect on result<\u002Fsc-raw-th><sc-raw-th>Owner<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ ruleRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"font-weight: 600;\">{{ r.name }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-variant-numeric: tabular-nums;\">{{ r.range }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ r.unit }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ r.effect }}<\u002Fsc-raw-td>\n              <sc-raw-td>{{ r.owner }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <p style=\"margin: var(--space-4) 0 0; font-size: 13px; color: var(--color-neutral-700);\">Out-of-range input is refused at the boundary — the engine never extrapolates beyond a signed range.<\u002Fp>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAudit }}\">\n    <main style=\"max-width: 1320px; padding: var(--space-6) var(--space-6) var(--space-8);\">\n      <p style=\"margin: 0 0 var(--space-2); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);\">04 — Audit trail<\u002Fp>\n      <h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 34px; margin: 0 0 var(--space-3);\">{{ runCountLabel }}<\u002Fh1>\n      <p style=\"margin: 0 0 var(--space-6); font-size: 16px; line-height: 1.5; max-width: 62ch; color: var(--color-neutral-800);\">Every run is recorded with its inputs, its result and the state of the AI layer — traceable from input to decision.<\u002Fp>\n      <sc-if value=\"{{ hasRuns }}\">\n        <sc-raw-table class=\"table\">\n          <sc-raw-thead>\n            <sc-raw-tr><sc-raw-th>Run<\u002Fsc-raw-th><sc-raw-th>Case<\u002Fsc-raw-th><sc-raw-th>Aircraft<\u002Fsc-raw-th><sc-raw-th>Weight · Alt · OAT<\u002Fsc-raw-th><sc-raw-th>TOD req.<\u002Fsc-raw-th><sc-raw-th>Margin<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th>AI layer<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ runRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-variant-numeric: tabular-nums; color: var(--color-neutral-700);\">{{ r.id }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-weight: 600;\">{{ r.case }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ r.ac }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric: tabular-nums;\">{{ r.inputs }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric: tabular-nums;\">{{ r.tod }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric: tabular-nums;\">{{ r.margin }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ r.status }}<\u002Fsc-raw-td>\n                <sc-raw-td>{{ r.ai }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noRuns }}\">\n        <p style=\"margin: 0; font-size: 15px; color: var(--color-neutral-700);\">No runs recorded yet. Open the console and run a calculation.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top: 2px solid var(--color-divider); padding: var(--space-4) var(--space-6); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700);\">Flight Engine MVP prototype — illustrative calculation model, not certified takeoff-performance data.<\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ruleVersion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;v1.0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Engine&quot;},&quot;showProjectFacts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Overview&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.defaults = { weight: 62000, altitude: 1500, oat: 24, flap: 10, runway: 2800, wind: 8 };\n    this.state = {\n      tab: \"Overview\",\n      caseName: \"FE-DEMO-001\",\n      acType: \"Narrowbody T-A (twin)\",\n      p: Object.assign({}, this.defaults),\n      guard: false,\n      result: null,\n      runs: []\n    };\n  }\n\n  specs() {\n    return [\n      { key: \"weight\", label: \"Gross weight\", unit: \"kg\", min: 40000, max: 79000, effect: \"Raises VR / V2 and takeoff distance\", owner: \"Flight eng.\" },\n      { key: \"altitude\", label: \"Pressure altitude\", unit: \"ft\", min: 0, max: 14000, effect: \"Reduces available thrust\", owner: \"Flight eng.\" },\n      { key: \"oat\", label: \"Outside air temp\", unit: \"°C\", min: -40, max: 55, effect: \"Lower density, longer distance\", owner: \"Flight eng.\" },\n      { key: \"flap\", label: \"Flap setting\", unit: \"deg\", min: 0, max: 30, effect: \"Shortens roll, lowers rotation speed\", owner: \"Mech. eng.\" },\n      { key: \"runway\", label: \"Runway available\", unit: \"m\", min: 800, max: 4000, effect: \"Sets field-length margin\", owner: \"Operations\" },\n      { key: \"wind\", label: \"Headwind component\", unit: \"kt\", min: -15, max: 35, effect: \"Headwind shortens, tailwind extends\", owner: \"Operations\" }\n    ];\n  }\n\n  v() { return this.props.ruleVersion || \"v1.0\"; }\n  fmt(n) { return Number(n).toLocaleString(\"en-US\", { maximumFractionDigits: 0 }); }\n  ok(s, val) { return val !== \"\" && !isNaN(val) && val >= s.min && val <= s.max; }\n  allValid() { return this.specs().every(s => this.ok(s, this.state.p[s.key])); }\n\n  compute(p) {\n    const dl = Math.pow(1 - 6.87535e-6 * p.altitude, 5.2559);\n    const th = (p.oat + 273.15) / 288.15;\n    const sg = dl / th;\n    const vs = 122 * Math.sqrt((p.weight / 60000) / sg) * (1 - p.flap * 0.006);\n    const vr = 1.10 * vs;\n    const tod = 1650 * Math.pow(p.weight / 60000, 2) * Math.pow(1 / sg, 1.6) * (1 + (15 - p.flap) * 0.018) * (1 - p.wind * 0.006);\n    let gr = 11.0 * (60000 / p.weight) * Math.pow(sg, 0.7) - p.flap * 0.12 - 2.0 * (1 - dl);\n    if (gr < 2.4) gr = 2.4;\n    return {\n      v1: Math.round(vr - 3 - Math.max(p.wind, 0) * 0.15),\n      vr: Math.round(vr),\n      v2: Math.round(1.20 * vs),\n      tod: Math.round(tod),\n      grad: gr,\n      margin: Math.round(p.runway - tod)\n    };\n  }\n\n  band(m) { return m < 0 ? \"warning\" : m < 250 ? \"caution\" : \"adequate\"; }\n\n  run = () => {\n    if (!this.allValid()) return;\n    const p = Object.assign({}, this.state.p);\n    const r = this.compute(p);\n    const ts = new Date().toISOString().replace(\"T\", \" \").slice(0, 19) + \"Z\";\n    const result = { r, p, ts, band: this.band(r.margin), case: this.state.caseName, ac: this.state.acType };\n    this.setState(s => ({\n      result,\n      runs: [{\n        id: \"R-\" + String(s.runs.length + 1).padStart(3, \"0\"),\n        case: result.case,\n        ac: result.ac,\n        inputs: this.fmt(p.weight) + \" kg · \" + this.fmt(p.altitude) + \" ft · \" + p.oat + \" °C\",\n        tod: this.fmt(r.tod) + \" m\",\n        margin: (r.margin >= 0 ? \"+\" : \"\") + this.fmt(r.margin) + \" m\",\n        status: result.band.charAt(0).toUpperCase() + result.band.slice(1),\n        ai: s.guard ? \"Blocked by guardrail\" : \"Explanation delivered\"\n      }].concat(s.runs)\n    }));\n  };\n\n  drivers(p) {\n    const out = [];\n    if (p.weight > 60000) out.push(\"High gross weight (\" + this.fmt(p.weight) + \" kg) raises VR and takeoff distance.\");\n    if (p.oat > 20) out.push(\"Warm OAT (\" + p.oat + \" °C) reduces air density, lengthening the required distance.\");\n    if (p.altitude > 1000) out.push(\"Pressure altitude \" + this.fmt(p.altitude) + \" ft further reduces available thrust.\");\n    if (p.flap >= 10) out.push(\"Flap \" + p.flap + \"° shortens the ground roll and lowers rotation speed.\");\n    if (p.wind >= 5) out.push(\"Headwind \" + p.wind + \" kt shortens the required distance.\");\n    if (p.wind < 0) out.push(\"Tailwind \" + Math.abs(p.wind) + \" kt extends the required distance.\");\n    if (!out.length) out.push(\"Parameters near mid-range; no single dominant driver.\");\n    return out;\n  }\n\n  turbineArt() {\n    const spin = { transformOrigin: \"260px 260px\", animation: \"fe-spin 140s linear infinite\" };\n    const L = (x1, y1, x2, y2) => React.createElement(\"line\", { key: x1 + \":\" + y1 + \":\" + x2, x1, y1, x2, y2 });\n    return React.createElement(\"svg\", {\n      viewBox: \"0 0 520 520\", \"aria-hidden\": \"true\", fill: \"none\", stroke: \"var(--color-accent)\",\n      strokeWidth: 2, style: { width: \"min(30vw, 132px)\", height: \"auto\", opacity: 0.9, display: \"block\" }\n    },\n      React.createElement(\"circle\", { cx: 260, cy: 260, r: 250 }),\n      React.createElement(\"circle\", { cx: 260, cy: 260, r: 190, strokeDasharray: \"2 12\" }),\n      React.createElement(\"circle\", { cx: 260, cy: 260, r: 120 }),\n      React.createElement(\"circle\", { cx: 260, cy: 260, r: 48 }),\n      React.createElement(\"g\", { style: spin },\n        L(260, 10, 260, 120), L(260, 400, 260, 510), L(10, 260, 120, 260), L(400, 260, 510, 260),\n        L(83, 83, 175, 175), L(345, 345, 437, 437), L(437, 83, 345, 175), L(175, 345, 83, 437)\n      )\n    );\n  }\n\n  renderVals() {\n    const st = this.state, res = st.result, accent = \"var(--color-accent)\";\n    const tabs = [\"Overview\", \"Console\", \"Rule set\", \"Audit trail\"].map(label => ({\n      label,\n      onClick: () => this.setState({ tab: label }),\n      bg: st.tab === label ? accent : \"transparent\",\n      fg: st.tab === label ? \"var(--color-bg)\" : \"var(--color-text)\",\n      border: st.tab === label ? accent : \"transparent\"\n    }));\n\n    const fields = this.specs().map(s => {\n      const val = st.p[s.key], good = this.ok(s, val);\n      return {\n        key: s.key, label: s.label, unit: s.unit, value: val,\n        onChange: e => {\n          const n = parseFloat(e.target.value);\n          this.setState(prev => ({ p: Object.assign({}, prev.p, { [s.key]: isNaN(n) ? \"\" : n }) }));\n        },\n        borderColor: good ? \"var(--color-neutral-400)\" : accent,\n        hintColor: good ? \"var(--color-neutral-700)\" : \"var(--color-accent-700)\",\n        hint: (good ? \"range \" : \"out of range \") + this.fmt(s.min) + \" – \" + this.fmt(s.max)\n      };\n    });\n\n    const styles = {\n      adequate: { bg: \"var(--color-neutral-200)\", fg: \"var(--color-text)\", border: \"var(--color-divider)\" },\n      caution: { bg: \"var(--color-accent-100)\", fg: \"var(--color-accent-900)\", border: \"var(--color-accent-500)\" },\n      warning: { bg: accent, fg: \"var(--color-bg)\", border: accent }\n    };\n    const bs = res ? styles[res.band] : styles.adequate;\n\n    return {\n      turbine: this.turbineArt(),\n      ruleVersion: this.v(),\n      tabs,\n      isOverview: st.tab === \"Overview\",\n      isConsole: st.tab === \"Console\",\n      isRules: st.tab === \"Rule set\",\n      isAudit: st.tab === \"Audit trail\",\n      goConsole: () => this.setState({ tab: \"Console\" }),\n      showProjectFacts: this.props.showProjectFacts !== false,\n\n      gains: [\n        { no: \"01\", title: \"Seconds, not spreadsheets.\", body: \"Enter the conditions, read the answer. Manual calculation time collapses to near zero.\" },\n        { no: \"02\", title: \"No number is ever a guess.\", body: \"Same inputs, same result — from a rule set you can inspect. No hidden assumptions, no drift.\" },\n        { no: \"03\", title: \"AI you can show a client.\", body: \"It explains the result in plain language and is checked before it appears. It cannot invent a figure.\" },\n        { no: \"04\", title: \"Audit-ready by default.\", body: \"Every calculation and every explanation is recorded — traceable from input to decision.\" }\n      ],\n      pipeline: [\n        { step: \"1\", label: \"Inputs\", bg: \"transparent\", fg: \"var(--color-text)\" },\n        { step: \"2\", label: \"Deterministic engine\", bg: accent, fg: \"var(--color-bg)\" },\n        { step: \"3\", label: \"Result\", bg: \"transparent\", fg: \"var(--color-text)\" },\n        { step: \"4\", label: \"Guarded AI\", bg: \"transparent\", fg: \"var(--color-text)\" },\n        { step: \"5\", label: \"Verify vs. result\", bg: \"var(--color-accent-100)\", fg: \"var(--color-accent-900)\" },\n        { step: \"6\", label: \"Explanation or blocked\", bg: \"transparent\", fg: \"var(--color-text)\" }\n      ],\n      facts: [\n        { k: \"Team\", v: \"6 people, fixed\" },\n        { k: \"Cadence\", v: \"5 × 2-week sprints\" },\n        { k: \"Gates\", v: \"SRR · PDR · CDR · TRR · ORR\" },\n        { k: \"Risk\", v: \"Live scored register\" },\n        { k: \"Baselines\", v: \"Scope · schedule · cost\" },\n        { k: \"Deadline\", v: \"10 weeks to release\" }\n      ],\n\n      caseName: st.caseName,\n      acType: st.acType,\n      onCaseName: e => this.setState({ caseName: e.target.value }),\n      onAcType: e => this.setState({ acType: e.target.value }),\n      fields,\n      run: this.run,\n      reset: () => this.setState({ p: Object.assign({}, this.defaults), result: null }),\n      runDisabled: !this.allValid(),\n      presets: [\n        { label: \"Standard day\", p: this.defaults },\n        { label: \"Hot & high\", p: { weight: 71000, altitude: 6500, oat: 42, flap: 5, runway: 3000, wind: 0 } },\n        { label: \"Short runway\", p: { weight: 68000, altitude: 900, oat: 30, flap: 15, runway: 1900, wind: -4 } }\n      ].map(x => ({ label: x.label, onClick: () => this.setState({ p: Object.assign({}, x.p) }) })),\n\n      speeds: [\n        { k: \"V1\", v: res ? res.r.v1 : \"—\" },\n        { k: \"VR\", v: res ? res.r.vr : \"—\" },\n        { k: \"V2\", v: res ? res.r.v2 : \"—\" }\n      ],\n      metrics: [\n        { k: \"Takeoff distance required\", v: res ? this.fmt(res.r.tod) + \" m\" : \"—\" },\n        { k: \"Net climb gradient\", v: res ? res.r.grad.toFixed(2) + \" %\" : \"—\" },\n        { k: \"Field-length margin\", v: res ? (res.r.margin >= 0 ? \"+\" : \"\") + this.fmt(res.r.margin) + \" m\" : \"—\" }\n      ],\n      hasStripe: !!res,\n      stripeBg: bs.bg, stripeFg: bs.fg, stripeBorder: bs.border,\n      stripeText: res\n        ? (res.band === \"warning\"\n            ? \"Warning — required distance exceeds runway available by \" + this.fmt(Math.abs(res.r.margin)) + \" m\"\n            : res.band === \"caution\" ? \"Caution — field-length margin below 250 m\" : \"Field-length margin adequate\")\n        : \"\",\n      resultFoot: res\n        ? \"case \" + res.case + \" · rule set \" + this.v() + \" · deterministic · \" + res.ts\n        : \"Run a calculation to produce a result.\",\n\n      guard: st.guard,\n      toggleGuard: e => this.setState({ guard: e.target.checked }),\n      aiIdle: !res,\n      aiBlocked: !!res && st.guard,\n      aiReady: !!res && !st.guard,\n      aiSummary: res\n        ? \"For case \" + res.case + \" the engine computes V1 \" + res.r.v1 + \" / VR \" + res.r.vr + \" / V2 \" + res.r.v2 +\n          \" kt, a takeoff distance required of \" + this.fmt(res.r.tod) + \" m and a net climb gradient of \" +\n          res.r.grad.toFixed(2) + \" %. Field-length margin is \" + (res.r.margin >= 0 ? \"+\" : \"\") + this.fmt(res.r.margin) +\n          \" m (\" + (res.band === \"warning\" ? \"insufficient\" : res.band === \"caution\" ? \"marginal\" : \"adequate\") + \").\"\n        : \"\",\n      aiDrivers: res ? this.drivers(res.p) : [],\n      aiCitation: res ? \"rule set \" + this.v() + \" · engine result \" + res.ts : \"\",\n\n      ruleRows: this.specs().map(s => ({\n        name: s.label,\n        range: this.fmt(s.min) + \" – \" + this.fmt(s.max),\n        unit: s.unit,\n        effect: s.effect,\n        owner: s.owner\n      })),\n\n      runCountLabel: st.runs.length === 1 ? \"1 recorded run\" : st.runs.length + \" recorded runs\",\n      hasRuns: st.runs.length > 0,\n      noRuns: st.runs.length === 0,\n      runRows: st.runs\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
